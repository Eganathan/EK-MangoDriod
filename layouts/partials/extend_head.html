{{- /* Article pages advertise the site feed; list pages already advertise their own feeds in PaperMod. */ -}}
{{- if not (.OutputFormats.Get "RSS") -}}
  {{- with .Site.Home.OutputFormats.Get "RSS" }}
<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ $.Site.Title }}">
  {{- end -}}
{{- end -}}

<script>document.documentElement.dataset.themeAdapter = 'papermod';document.documentElement.dataset.theme = 'dark';</script>
<script src="{{ "js/ek-theme-preference.js" | relURL }}?v=shared-theme-1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/ek-tokens.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/ek-theme.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/blog.css" | relURL }}">
<script src="{{ "js/ek-theme.js" | relURL }}?v=shared-theme-1" defer></script>
