enableRobotsTXT: true
baseURL: "https://md.eknath.dev"
languageCode: en-us
title: MangoDriod
theme: ["PaperMod"]
powered: "no"

menu:
  main:
    - identifier: "search"
      name: Search
      url: /search/
      weight: 1
    - identifier: "categories"
      name: Categories
      url: /categories/
      weight: 2
    - identifier: "tags"
      name: Tags
      url: /tags/
      weight: 3
    - identifier: "archives"
      name: Archives
      url: /archives/
      weight: 4
    - identifier: "resources"
      name: Resources
      url: /resources/
      weight: 5
    - identifier: "rss"
      name: RSS
      url: /index.xml
      weight: 6


enableGitInfo: true

params:
  author: "Eganathan R (Eknath)"
  env: production
  assets:
    favicon: "/favicon.svg?v=3"
    favicon16x16: "/favicon-16x16.png?v=3"
    favicon32x32: "/favicon-32x32.png?v=3"
    apple_touch_icon: "/apple-touch-icon.png?v=3"
    safari_pinned_tab: "/safari-pinned-tab.svg?v=3"
  mainSections: ["posts"]
  rssSections: ["posts"]
  ShowLastMod: true
  defaultTheme: dark
  disableThemeToggle: true # shared header/JS owns theme switching
  hideFooter: true # shared footer supplied by extend_footer
  title: MangoDriod-A personal Tech Blog of Eknath
  description: "I write about Software-Development,Kotlin, Compose, Android and everything that interests me."
  keywords: [Blog, Android, Kotlin,Zoho,Eganathan,Google, Tech, Software Development]
  homeInfoParams:
    Title: Field notes.
    Content: "MangoDriod is where I think through software, systems, and the changing practice of engineering. I write about architecture, multiplatform development, and my experiments with AI-assisted workflows—including the decisions, trade-offs, and unfinished questions behind them."

  socialIcons:
    - name: "X"
      url: "https://x.com/eknath_dev"
    - name: "Github"
      url: "https://github.com/Eganathan"
    - name: "Linkedin"
      url: "https://linkedin.com/in/eganathan/"
    - name: "Socials"
      url: "https://eknath.dev/"

  ShowCodeCopyButtons: true
  comments: true

  ShowShareButtons: true
  ShowReadingTime: true

  ShowToc: true
  TocOpen: false

  ShowBreadCrumbs: true

  ShowPostNavLinks: true # Next and Previous Posts navigation

  ShowFullTextinRSS: true
  ShowRssButtonInSectionTermList: true

outputs:
  home:
  - HTML
  - RSS
  - JSON # necessary for search
  - RECENT
  section:
  - HTML
  - RSS

services:
  rss:
    limit: -1
  googleAnalytics:
    id: "G-MVDW52KZVB"

markup:
  goldmark:
    renderer:
      unsafe: true

outputFormats:
  RECENT:
    mediaType: application/json
    baseName: recent
    isPlainText: true
    notAlternative: true
