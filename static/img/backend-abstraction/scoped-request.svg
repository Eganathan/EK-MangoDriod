<svg xmlns="http://www.w3.org/2000/svg" width="760" height="722" viewBox="0 0 760 722" role="img" aria-labelledby="title desc">
<title id="title">One request, one permitted scope</title>
<desc id="desc">Intention: Show my open todos → Request: GET /v1/projects/p_123/todos?filter.status=open → Server establishes scope: Verified caller + project membership + record permissions → Storage operation: Allowed project AND visible records AND requested filters → Response: Only permitted fields and records + a scoped page cursor</desc>
<rect width="760" height="722" rx="20" fill="#101b2d"/>
<text x="380" y="46" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="23" font-weight="700">One request, one permitted scope</text>
<rect x="42" y="82" width="676" height="78" rx="12" fill="#1d304a" stroke="#648eb5"/>
<text x="380" y="112" text-anchor="middle" fill="#8de1d0" font-family="sans-serif" font-size="21" font-weight="700">Intention</text>
<text x="380" y="139" text-anchor="middle" fill="#eef2f7" font-family="sans-serif" font-size="18">Show my open todos</text>
<path d="M380 165 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#8de1d0" stroke-width="3"/>
<rect x="42" y="190" width="676" height="78" rx="12" fill="#1d304a" stroke="#648eb5"/>
<text x="380" y="220" text-anchor="middle" fill="#8de1d0" font-family="sans-serif" font-size="21" font-weight="700">Request</text>
<text x="380" y="247" text-anchor="middle" fill="#eef2f7" font-family="sans-serif" font-size="18">GET /v1/projects/p_123/todos?filter.status=open</text>
<path d="M380 273 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#8de1d0" stroke-width="3"/>
<rect x="42" y="298" width="676" height="78" rx="12" fill="#1d304a" stroke="#648eb5"/>
<text x="380" y="328" text-anchor="middle" fill="#8de1d0" font-family="sans-serif" font-size="21" font-weight="700">Server establishes scope</text>
<text x="380" y="355" text-anchor="middle" fill="#eef2f7" font-family="sans-serif" font-size="18">Verified caller + project membership + record permissions</text>
<path d="M380 381 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#8de1d0" stroke-width="3"/>
<rect x="42" y="406" width="676" height="78" rx="12" fill="#1d304a" stroke="#648eb5"/>
<text x="380" y="436" text-anchor="middle" fill="#8de1d0" font-family="sans-serif" font-size="21" font-weight="700">Storage operation</text>
<text x="380" y="463" text-anchor="middle" fill="#eef2f7" font-family="sans-serif" font-size="18">Allowed project AND visible records AND requested filters</text>
<path d="M380 489 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#8de1d0" stroke-width="3"/>
<rect x="42" y="514" width="676" height="78" rx="12" fill="#1d304a" stroke="#648eb5"/>
<text x="380" y="544" text-anchor="middle" fill="#8de1d0" font-family="sans-serif" font-size="21" font-weight="700">Response</text>
<text x="380" y="571" text-anchor="middle" fill="#eef2f7" font-family="sans-serif" font-size="18">Only permitted fields and records + a scoped page cursor</text>
<text x="380" y="693" text-anchor="middle" fill="#c0ccdc" font-family="sans-serif" font-size="16">The same boundary applies to search, bulk writes, preferences, and sync.</text></svg>